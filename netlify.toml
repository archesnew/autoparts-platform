# Netlify Configuration for ZAPTUT.PRO Staging Deployment

[build]
  command = "prisma generate --schema=prisma/schema.prisma && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Staging Protection: Disallow indexing by any search engine
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
