services:
  postgres:
    image: postgres:16-alpine
    container_name: zaptut-local-postgres
    environment:
      POSTGRES_DB: zaptut_dev
      POSTGRES_USER: zaptut_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - zaptut_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaptut_dev -d zaptut_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  zaptut_postgres_data:
    name: zaptut_postgres_data
